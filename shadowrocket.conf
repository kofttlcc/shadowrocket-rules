# Shadowrocket for iOS — generated configuration
# PROXY uses your existing selected node; this file contains no node credentials.
# Select configuration routing mode in Shadowrocket.
# Upstream whitelist policy: unmatched traffic uses PROXY.

[General]
dns-server = system
ipv6 = true
prefer-ipv6 = false
private-ip-answer = true

[Rule]
RULE-SET,https://raw.githubusercontent.com/kofttlcc/shadowrocket-rules/release/ruleset/private.txt,DIRECT
RULE-SET,https://raw.githubusercontent.com/kofttlcc/shadowrocket-rules/release/ruleset/reject.txt,REJECT
RULE-SET,https://raw.githubusercontent.com/kofttlcc/shadowrocket-rules/release/ruleset/icloud.txt,DIRECT
RULE-SET,https://raw.githubusercontent.com/kofttlcc/shadowrocket-rules/release/ruleset/apple.txt,DIRECT
# google.txt retains upstream DIRECT policy; upstream advises caution with this list.
RULE-SET,https://raw.githubusercontent.com/kofttlcc/shadowrocket-rules/release/ruleset/google.txt,DIRECT
RULE-SET,https://raw.githubusercontent.com/kofttlcc/shadowrocket-rules/release/ruleset/proxy.txt,PROXY
RULE-SET,https://raw.githubusercontent.com/kofttlcc/shadowrocket-rules/release/ruleset/direct.txt,DIRECT
RULE-SET,https://raw.githubusercontent.com/kofttlcc/shadowrocket-rules/release/ruleset/telegramcidr.txt,PROXY
RULE-SET,https://raw.githubusercontent.com/kofttlcc/shadowrocket-rules/release/ruleset/cncidr.txt,DIRECT
# Literal LAN ranges use no-resolve to avoid triggering DNS for this check.
IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
IP-CIDR,169.254.0.0/16,DIRECT,no-resolve
IP-CIDR,224.0.0.0/4,DIRECT,no-resolve
IP-CIDR,255.255.255.255/32,DIRECT,no-resolve
IP-CIDR,::1/128,DIRECT,no-resolve
IP-CIDR,fc00::/7,DIRECT,no-resolve
IP-CIDR,fe80::/10,DIRECT,no-resolve
IP-CIDR,ff00::/8,DIRECT,no-resolve
FINAL,PROXY
